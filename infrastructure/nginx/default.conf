# Serves the SPA and reverse-proxies the API on the same origin, so the HttpOnly refresh
# cookie is first-party and SameSite=Strict works without cross-site configuration.
# Runs as the unprivileged nginx user on port 8080 (see infrastructure/docker/web.Dockerfile).

# Short-lived cache for the server-generated SEO fragments (no personal data in them).
proxy_cache_path /tmp/nginx-seo-cache levels=1:2 keys_zone=seo:10m max_size=50m inactive=10m use_temp_path=off;

# Hide upstream timing and errors from the public; keep request ids for correlation.
map $http_x_request_id $req_id {
  default   $http_x_request_id;
  ""        $request_id;
}

log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id","remote":"$remote_addr",'
  '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration":$request_time,"upstream":"$upstream_response_time","ua":"$http_user_agent"}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 3m;
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $req_id;
    proxy_read_timeout 60s;
  }

  # The Prometheus endpoint is scraped inside the private network only, never through the edge.
  location = /metrics { return 404; }

  location = /sitemap.xml {
    proxy_pass http://api:4000/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
  }
  location = /robots.txt {
    proxy_pass http://api:4000/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
  }

  # Server-side include target for index.html: per-URL <head> metadata and a crawlable summary.
  location /__seo/ {
    internal;
    proxy_pass http://api:4000/api/v1/seo/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_cache seo;
    proxy_cache_valid 200 5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
    # The stock mime.types has no .mjs entry; module workers (MapLibre) require a JS MIME type.
    location ~* \.mjs$ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      types { }
      default_type text/javascript;
      try_files $uri =404;
    }
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    # index.html carries SSI includes; if the API is slow or down the static fallback is used.
    ssi on;
    ssi_silent_errors on;
    try_files $uri $uri/ /index.html;
  }
}
