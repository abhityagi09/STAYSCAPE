# Example Prometheus configuration (private network). Each API replica exposes /metrics.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: stayscape-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    dns_sd_configs:
      # Resolves every API replica (Docker/Kubernetes service DNS).
      - names: ['api']
        type: A
        port: 4000
